name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx ng lint

  unit-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:ci

  build-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:lib

  build-demo:
    needs: [build-lib]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:demo

  pack:
    needs: [build-lib]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:lib
      - run: bash scripts/patch-fesm-change-detection.sh
      - run: mkdir -p dist-pack && npm pack ./dist/ng2-smart-table --pack-destination dist-pack
      - name: Expose lib.tgz for consumers
        run: |
          f="$(ls -1 dist-pack/*.tgz | head -1)"
          cp "$f" dist-pack/lib.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist-pack/

  consumer-smoke:
    needs: [pack]
    runs-on: ubuntu-latest
    # Peer range is >=18 <23; matrix validates Angular 18 and 22 consumers.
    strategy:
      fail-fast: false
      matrix:
        include:
          - angular-version: '18'
            consumer-dir: consumer-smoke-ng18
            node-version: '20'
          - angular-version: '22'
            consumer-dir: consumer-smoke
            node-version: '22'
          - angular-version: '22'
            consumer-dir: consumer-smoke
            node-version: '24'
    name: consumer-smoke (Angular ${{ matrix.angular-version }}, Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist-pack
      - name: Install CI tarball (no lockfile pinned to lib.tgz)
        run: |
          test -f dist-pack/lib.tgz
          cd "${{ matrix.consumer-dir }}"
          rm -rf node_modules
          npm install --no-audit --no-fund
      - run: cd "${{ matrix.consumer-dir }}" && npm run build
